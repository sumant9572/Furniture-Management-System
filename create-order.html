<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Order - Furniture House Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="wrapper">
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center" href="index.html">
                    <i class="fas fa-couch me-2"></i>
                    <span>Furniture House</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="inventory.html">Inventory</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="orders.html">Orders</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="customers.html">Customers</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="reports.html">Reports</a>
                        </li>
                    </ul>
                    <div class="d-flex">
                        <a href="#login" class="btn btn-outline-primary">Login</a>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="container py-4">
            <div class="row">
                <div class="col-lg-8">
                    <!-- Order Form -->
                    <div class="card shadow-sm mb-4">
                        <div class="card-header bg-primary text-white">
                            <h3 class="card-title mb-0">Create New Order</h3>
                        </div>
                        <div class="card-body">
                            <form id="createOrderForm" onsubmit="handleSubmit(event)">
                                <!-- Customer Information -->
                                <div class="mb-4">
                                    <h5>Customer Information</h5>
                                    <div class="row g-3">
                                        <div class="col-md-6">
                                            <label class="form-label">First Name</label>
                                            <input type="text" class="form-control" name="firstName" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Last Name</label>
                                            <input type="text" class="form-control" name="lastName" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Email</label>
                                            <input type="email" class="form-control" name="email" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Phone</label>
                                            <input type="tel" class="form-control" name="phone" required>
                                        </div>
                                    </div>
                                </div>

                                <!-- Shipping Address -->
                                <div class="mb-4">
                                    <h5>Shipping Address</h5>
                                    <div class="row g-3">
                                        <div class="col-12">
                                            <label class="form-label">Street Address</label>
                                            <input type="text" class="form-control" name="address" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">City</label>
                                            <input type="text" class="form-control" name="city" required>
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label">State</label>
                                            <input type="text" class="form-control" name="state" required>
                                        </div>
                                        <div class="col-md-2">
                                            <label class="form-label">ZIP Code</label>
                                            <input type="text" class="form-control" name="zipCode" required>
                                        </div>
                                    </div>
                                </div>

                                <!-- Order Items -->
                                <div class="mb-4">
                                    <div class="d-flex justify-content-between align-items-center mb-3">
                                        <h5 class="mb-0">Order Items</h5>
                                        <button type="button" class="btn btn-sm btn-outline-primary" onclick="addOrderItem()">
                                            <i class="fas fa-plus me-2"></i>Add Item
                                        </button>
                                    </div>
                                    <div id="orderItems">
                                        <!-- Order items will be added here dynamically -->
                                    </div>
                                </div>

                                <!-- Submit Buttons -->
                                <div class="d-flex justify-content-end gap-2">
                                    <button type="button" class="btn btn-secondary" onclick="window.location.href='orders.html'">Cancel</button>
                                    <button type="submit" class="btn btn-primary">Create Order</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Order Summary -->
                <div class="col-lg-4">
                    <div class="card shadow-sm">
                        <div class="card-header bg-light">
                            <h5 class="card-title mb-0">Order Summary</h5>
                        </div>
                        <div class="card-body">
                            <div class="d-flex justify-content-between mb-2">
                                <span>Subtotal:</span>
                                <span id="subtotal">$0.00</span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span>Shipping:</span>
                                <span id="shipping">$50.00</span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span>Tax (10%):</span>
                                <span id="tax">$0.00</span>
                            </div>
                            <hr>
                            <div class="d-flex justify-content-between">
                                <strong>Total:</strong>
                                <strong id="total">$50.00</strong>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer mt-auto py-3 bg-dark text-white">
            <div class="container text-center">
                <p class="mb-0">&copy; 2024 Furniture House Management System. All rights reserved.</p>
            </div>
        </footer>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Order Creation Script -->
    <script>
        let products = [];
        
        // Load products when page loads
        document.addEventListener('DOMContentLoaded', () => {
            products = JSON.parse(localStorage.getItem('products')) || [];
        });

        function addOrderItem() {
            const orderItems = document.getElementById('orderItems');
            const itemIndex = orderItems.children.length;

            const itemHtml = `
                <div class="card mb-3 order-item">
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Product</label>
                                <select class="form-select" name="items[${itemIndex}][productId]" onchange="updatePrice(this, ${itemIndex})" required>
                                    <option value="">Select Product</option>
                                    ${products.map(product => `
                                        <option value="${product.sku}" data-price="${product.price}">
                                            ${product.productName} - $${product.price}
                                        </option>
                                    `).join('')}
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Quantity</label>
                                <input type="number" class="form-control" name="items[${itemIndex}][quantity]" 
                                       min="1" value="1" onchange="updatePrice(this, ${itemIndex})" required>
                            </div>
                            <div class="col-md-2 d-flex align-items-end">
                                <button type="button" class="btn btn-outline-danger" onclick="removeOrderItem(this)">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            orderItems.insertAdjacentHTML('beforeend', itemHtml);
            updateTotals();
        }

        function removeOrderItem(button) {
            button.closest('.order-item').remove();
            updateTotals();
        }

        function updatePrice(element, itemIndex) {
            updateTotals();
        }

        function updateTotals() {
            const orderItems = document.querySelectorAll('.order-item');
            let subtotal = 0;

            orderItems.forEach(item => {
                const select = item.querySelector('select');
                const quantity = parseInt(item.querySelector('input[type="number"]').value);
                const selectedOption = select.options[select.selectedIndex];
                
                if (selectedOption && selectedOption.dataset.price) {
                    subtotal += parseFloat(selectedOption.dataset.price) * quantity;
                }
            });

            const shipping = 50;
            const tax = subtotal * 0.1;
            const total = subtotal + shipping + tax;

            document.getElementById('subtotal').textContent = `$${subtotal.toFixed(2)}`;
            document.getElementById('shipping').textContent = `$${shipping.toFixed(2)}`;
            document.getElementById('tax').textContent = `$${tax.toFixed(2)}`;
            document.getElementById('total').textContent = `$${total.toFixed(2)}`;
        }

        function handleSubmit(event) {
            event.preventDefault();
            
            const form = event.target;
            const formData = new FormData(form);
            
            // Create order object
            const orderData = {
                orderNumber: 'ORD-' + Date.now(),
                orderDate: new Date().toISOString(),
                shipping: {
                    firstName: formData.get('firstName'),
                    lastName: formData.get('lastName'),
                    email: formData.get('email'),
                    phone: formData.get('phone'),
                    address: formData.get('address'),
                    city: formData.get('city'),
                    state: formData.get('state'),
                    zipCode: formData.get('zipCode')
                },
                items: []
            };

            // Get all order items
            const orderItems = document.querySelectorAll('.order-item');
            orderItems.forEach((item, index) => {
                const productSelect = item.querySelector('select');
                const quantityInput = item.querySelector('input[type="number"]');
                const selectedOption = productSelect.options[productSelect.selectedIndex];

                if (selectedOption.value && quantityInput.value) {
                    const product = products.find(p => p.sku === selectedOption.value);
                    if (product) {
                        orderData.items.push({
                            sku: product.sku,
                            name: product.productName,
                            price: product.price,
                            quantity: parseInt(quantityInput.value)
                        });
                    }
                }
            });

            // Get existing orders from localStorage
            const orders = JSON.parse(localStorage.getItem('orders')) || [];
            
            // Add new order
            orders.push(orderData);
            
            // Save back to localStorage
            localStorage.setItem('orders', JSON.stringify(orders));

            // Show success message
            alert('Order created successfully!');
            
            // Redirect to orders page
            window.location.href = 'orders.html';
        }

        // Add first item row when page loads
        document.addEventListener('DOMContentLoaded', () => {
            addOrderItem();
        });
    </script>
</body>
</html>
