<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Product - Furniture House Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="wrapper">
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center" href="index.html">
                    <i class="fas fa-couch me-2"></i>
                    <span>Furniture House</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="inventory.html">Inventory</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="orders.html">Orders</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="customers.html">Customers</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="reports.html">Reports</a>
                        </li>
                    </ul>
                    <div class="d-flex">
                        <a href="#login" class="btn btn-outline-primary">Login</a>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="container py-4">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white">
                            <h3 class="card-title mb-0">Create New Product</h3>
                        </div>
                        <div class="card-body">
                            <form id="createProductForm" onsubmit="handleSubmit(event)">
                                <!-- Basic Information -->
                                <div class="mb-4">
                                    <h5>Basic Information</h5>
                                    <div class="row g-3">
                                        <div class="col-md-6">
                                            <label class="form-label">Product Name</label>
                                            <input type="text" class="form-control" name="productName" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">SKU</label>
                                            <input type="text" class="form-control" name="sku" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Category</label>
                                            <select class="form-select" name="category" required>
                                                <option value="">Select Category</option>
                                                <option value="living-room">Living Room</option>
                                                <option value="bedroom">Bedroom</option>
                                                <option value="dining-room">Dining Room</option>
                                                <option value="office">Office</option>
                                                <option value="outdoor">Outdoor</option>
                                            </select>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Brand</label>
                                            <input type="text" class="form-control" name="brand" required>
                                        </div>
                                    </div>
                                </div>

                                <!-- Pricing and Inventory -->
                                <div class="mb-4">
                                    <h5>Pricing & Inventory</h5>
                                    <div class="row g-3">
                                        <div class="col-md-4">
                                            <label class="form-label">Price ($)</label>
                                            <input type="number" class="form-control" name="price" step="0.01" required>
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label">Cost ($)</label>
                                            <input type="number" class="form-control" name="cost" step="0.01" required>
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label">Quantity</label>
                                            <input type="number" class="form-control" name="quantity" required>
                                        </div>
                                    </div>
                                </div>

                                <!-- Product Details -->
                                <div class="mb-4">
                                    <h5>Product Details</h5>
                                    <div class="row g-3">
                                        <div class="col-12">
                                            <label class="form-label">Description</label>
                                            <textarea class="form-control" name="description" rows="4" required></textarea>
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label">Width (inches)</label>
                                            <input type="number" class="form-control" name="width" step="0.1" required>
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label">Height (inches)</label>
                                            <input type="number" class="form-control" name="height" step="0.1" required>
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label">Depth (inches)</label>
                                            <input type="number" class="form-control" name="depth" step="0.1" required>
                                        </div>
                                    </div>
                                </div>

                                <!-- Images -->
                                <div class="mb-4">
                                    <h5>Product Images</h5>
                                    <div class="row g-3">
                                        <div class="col-12">
                                            <label class="form-label">Main Image</label>
                                            <input type="file" class="form-control" name="mainImage" accept="image/*" required>
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label">Additional Images</label>
                                            <input type="file" class="form-control" name="additionalImages" accept="image/*" multiple>
                                        </div>
                                    </div>
                                </div>

                                <!-- Submit Buttons -->
                                <div class="d-flex justify-content-end gap-2">
                                    <button type="button" class="btn btn-secondary" onclick="window.location.href='inventory.html'">Cancel</button>
                                    <button type="submit" class="btn btn-primary">Create Product</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer mt-auto py-3 bg-dark text-white">
            <div class="container text-center">
                <p class="mb-0">&copy; 2024 Furniture House Management System. All rights reserved.</p>
            </div>
        </footer>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Product Creation Script -->
    <script>
        function handleSubmit(event) {
            event.preventDefault();
            
            // Get form data
            const form = event.target;
            const formData = new FormData(form);
            
            // Convert form data to object
            const productData = {
                productName: formData.get('productName'),
                sku: formData.get('sku'),
                category: formData.get('category'),
                brand: formData.get('brand'),
                price: parseFloat(formData.get('price')),
                cost: parseFloat(formData.get('cost')),
                quantity: parseInt(formData.get('quantity')),
                description: formData.get('description'),
                dimensions: {
                    width: parseFloat(formData.get('width')),
                    height: parseFloat(formData.get('height')),
                    depth: parseFloat(formData.get('depth'))
                },
                createdAt: new Date().toISOString()
            };

            // Get existing products from localStorage
            const products = JSON.parse(localStorage.getItem('products')) || [];
            
            // Add new product
            products.push(productData);
            
            // Save back to localStorage
            localStorage.setItem('products', JSON.stringify(products));

            // Show success message
            alert('Product created successfully!');
            
            // Redirect to inventory page
            window.location.href = 'inventory.html';
        }
    </script>
</body>
</html>
